aid: vaultdragon
name: VaultDragon
description: >-
  VaultDragon (Vault Dragon Pte Ltd) is a Singapore-based digital healthcare
  company building end-to-end practice-management software for clinics and
  medical providers across Southeast Asia and China. Its product suite includes
  DragonHub, an end-to-end clinic-management platform covering appointment
  scheduling, patient tracking, electronic health records, inventory and
  invoicing; DragonCare, a patient-facing web app for self-booking, reminders
  and access to medical history; DragonInsights, an on-demand business-
  intelligence and analytics layer; and DragonLab, a laboratory information
  system automating the workflow from sample receipt to report delivery.
  VaultDragon serves 650+ healthcare providers across Singapore, China,
  Indonesia, Thailand and Cambodia. The platform is delivered as a hosted SaaS
  (hub.vaultdragon.com) backed by a private, authenticated internal API; the
  company currently publishes no public developer portal, OpenAPI specification,
  or client SDKs. Surfaced as a portfolio company of 500 Global and added to the
  API Evangelist network for enrichment.
